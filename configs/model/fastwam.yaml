_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

# FlashVLA-style streaming action decoding is opt-in. Four rolling-buffer
# slots, each containing a 16-action chunk, give a 64-action horizon. Enabling
# it requires a streaming-trained checkpoint and caller-owned per-episode state.
streaming_action:
  enabled: false
  num_slots: 4  # buffer_size, measured in chunks
  chunk_size: 16

# The public streaming API and VAE remain eager; when enabled, torch.compile
# wraps one fixed-shape video/MoT KV-prefill kernel plus separate cold-start and
# steady-state action kernels. These null options resolve by inference mode:
# legacy preserves dynamic graphs with CUDA graphs disabled; streaming uses
# FlashVLA's static CUDA-graph execution.
torch_compile_infer_action: false
torch_compile_mode: max-autotune
torch_compile_dynamic: null
torch_compile_disable_cudagraphs: null

loss:
  lambda_action: 1.0
